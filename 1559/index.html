<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ETC Fee Mechanism Scenario Explorer — Olympia Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --etc-green:#3ab83a;
      --olympic-gold:#d4af37;
    }
    body {
      background:
        radial-gradient(1000px 600px at 20% -10%, #0c0e10, transparent),
        radial-gradient(800px 500px at 120% 10%, #0b0d0f, transparent),
        linear-gradient(180deg, #0a0c0e, #0b0d10);
    }
    .title-font { font-family: "Cinzel", serif; letter-spacing: 0.02em; }
    .ui-font { font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial; }
    .greek-key { position: relative; border: 1px solid rgba(212,175,55,0.25); }
    .greek-key:before { content:""; position:absolute; inset:6px; border:1px solid rgba(212,175,55,0.18); pointer-events:none; }
    .panel { background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00)); }
    .gold { color: var(--olympic-gold); }
    .accent { color: var(--etc-green); }
    .tooltip-panel { z-index: 60; }
    #errbox { display:none; white-space:pre-wrap; }
  </style>
</head>
<body class="ui-font text-white">
  <div id="root"></div>
  <pre id="errbox" class="m-4 p-4 bg-red-950/40 border border-red-700/50 rounded text-red-200 text-sm"></pre>

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Load simulation as global variable first -->
  <script>
    window.SimulationModule = null;
    fetch('./simulation.js')
      .then(r => r.text())
      .then(code => {
        const moduleExports = {};
        const module = { exports: moduleExports };
        const fn = new Function('module', 'exports', code);
        fn(module, moduleExports);
        window.SimulationModule = module.exports;
      })
      .catch(err => console.error('Failed to load simulation.js:', err));
  </script>

  <!-- Main app with JSX/Babel -->
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // Emoji icons
    const I = {
      Info: (p)=><span {...p}>ℹ️</span>,
      Users:(p)=><span {...p}>👥</span>,
      Flame:(p)=><span {...p}>🔥</span>,
      Lock:(p)=><span {...p}>🔒</span>,
      ArrowRight:(p)=><span {...p}>➡️</span>,
      TrendingUp:(p)=><span {...p}>📈</span>,
      ArrowDown:(p)=><span {...p}>⬇️</span>,
      ArrowUp:(p)=><span {...p}>⬆️</span>,
      Minus:(p)=><span {...p}>➖</span>,
      Laurel:(p)=><span {...p}>🏛️</span>,
    };

    // Enhanced info tooltip component with better styling
    const InfoTooltip = ({ title, children }) => (
      <span className="group relative inline-flex items-center ml-2 align-middle cursor-help">
        <span className="text-slate-300 hover:text-slate-100 transition-colors">ℹ️</span>
        <span className="tooltip-panel invisible group-hover:visible absolute w-96 p-4 mt-2 text-sm text-white bg-gray-900 border border-emerald-500/30 rounded-lg shadow-xl -left-40 z-50">
          <div className="font-semibold mb-2 text-emerald-300">{title}</div>
          <div className="text-gray-300 leading-relaxed">{children}</div>
        </span>
      </span>
    );

    function App() {
      // ===== ALL HOOKS AT TOP =====
      const [Sim, setSim] = useState(null);
      const [selectedScenarios, setSelectedScenarios] = useState(["classic","olympia","burn"]);
      const [treasuryEnabled, setTreasuryEnabled] = useState(true);
      const [selectedEra, setSelectedEra] = useState(4);
      const [targetBlockSize, setTargetBlockSize] = useState(15);
      const [demandLevel, setDemandLevel] = useState(20);
      const [priceK, setPriceK] = useState(50);
      const [initialBaseFee, setInitialBaseFee] = useState(50);
      const [tipsGwei, setTipsGwei] = useState(2);
      const [numBlocks, setNumBlocks] = useState(100_000);
      const [capChoice, setCapChoice] = useState("500k");
      const [use1559, setUse1559] = useState(true);
      const [minerMode, setMinerMode] = useState("equal");
      const [rngSeed, setRngSeed] = useState(1);

      // Load simulation module
      useEffect(() => {
        const checkSim = setInterval(() => {
          if (window.SimulationModule) {
            setSim(window.SimulationModule);
            clearInterval(checkSim);
          }
        }, 100);
        return () => clearInterval(checkSim);
      }, []);

      // Scenarios definition
      const baseScenarios = {
        classic: {
          name:"EIP-1559 No Burn/Treasury",
          description:"Base fee goes 100% to miners (not burned)",
          burnFraction:0.0, contractFraction:0.0, payForwardFraction:0.0, ellWindow:0,
          icon:I.Lock, color:"#6B7280"
        },
        burn: {
          name:"EIP-1559 Burn Model",
          description:"Like Ethereum: Base fee burned, reducing supply",
          burnFraction:1.0, contractFraction:0.0, payForwardFraction:0.0, ellWindow:0,
          icon:I.Flame, color:"#F59E0B"
        },
        olympia: {
          name:"Olympia Treasury",
          description:"Base fee → Treasury contract for ecosystem funding",
          burnFraction:0.0, contractFraction:1.0, payForwardFraction:0.0, ellWindow:0,
          icon:I.Users, color:"#3ab83a"
        },
        blended: {
          name:"Blended (50/50)",
          description:"Half to miner, half to treasury (no burn)",
          burnFraction:0.0, contractFraction:0.5, payForwardFraction:0.0, ellWindow:0,
          icon:I.TrendingUp, color:"#8B5CF6"
        },
        lsmoothed: {
          name:"ℓ-Smoothed Security",
          description:"25% treasury, 75% distributed over next ℓ blocks",
          burnFraction:0.0, contractFraction:0.25, payForwardFraction:0.75, ellWindow:100,
          icon:I.ArrowRight, color:"#06B6D4"
        }
      };

      // All useMemo hooks
      const scenarios = useMemo(()=>{
        const out = {};
        for (const [k, s] of Object.entries(baseScenarios)) {
          out[k] = { ...s, contractFraction: treasuryEnabled ? s.contractFraction : 0 };
        }
        return out;
      }, [treasuryEnabled]);

      const simulationConstants = useMemo(() => {
        if (!Sim) return { ERA_BLOCKS: 5_000_000, NUM_MINERS: 5, GENESIS_SUPPLY: 72_000_000 };
        return {
          ERA_BLOCKS: Sim.ERA_BLOCKS,
          NUM_MINERS: Sim.NUM_MINERS,
          GENESIS_SUPPLY: Sim.GENESIS_SUPPLY,
        };
      }, [Sim]);

      const currentBlockHeight = useMemo(() => selectedEra * simulationConstants.ERA_BLOCKS, [selectedEra, simulationConstants.ERA_BLOCKS]);
      const safetyCap = useMemo(() => capChoice==="500k" ? 500_000 : capChoice==="2.5m" ? 2_500_000 : Infinity, [capChoice]);
      
      const startingSupply = useMemo(() => {
        if (!Sim) return simulationConstants.GENESIS_SUPPLY;
        return Sim.supplyFromHeight(currentBlockHeight);
      }, [currentBlockHeight, Sim, simulationConstants.GENESIS_SUPPLY]);

      const scenarioResults = useMemo(()=>{
        if (!Sim) {
          const out = {};
          for (const k of selectedScenarios) {
            out[k] = { summary: { simulatedBlocks:0, totalEmitted:0, totalBurned:0, totalToContract:0, totalMinerRevenue:0, totalBaseFeeRevenue:0, avgBaseFee:0, avgBaseFeeRevenue:0, finalSupply: startingSupply, netSupplyChange:0, avgBlockReward:0, avgBaseFeeToMiner:0, avgTips:0, avgPayForward:0, avgMinerRevenue:0, perMiner:Array.from({length:simulationConstants.NUM_MINERS},(_,i)=>({miner:i+1, blocksWon:0, avgRevenuePerWonBlock:0, totalRevenue:0})) } };
          }
          return out;
        }

        const out = {};
        for (const k of selectedScenarios) {
          const scenario = scenarios[k];
          const requested = Math.max(0, numBlocks);
          const n = Math.min(requested, safetyCap, simulationConstants.ERA_BLOCKS);
          
          if (n === 0) {
            out[k] = { summary: { simulatedBlocks:0, totalEmitted:0, totalBurned:0, totalToContract:0, totalMinerRevenue:0, totalBaseFeeRevenue:0, avgBaseFee:use1559?initialBaseFee:0, avgBaseFeeRevenue:0, finalSupply: startingSupply, netSupplyChange:0, avgBlockReward:0, avgBaseFeeToMiner:0, avgTips:0, avgPayForward:0, avgMinerRevenue:0, perMiner:Array.from({length:simulationConstants.NUM_MINERS},(_,i)=>({miner:i+1, blocksWon:0, avgRevenuePerWonBlock:0, totalRevenue:0})) } };
          } else {
            try {
              const summary = Sim.simulate({
                startingBlockHeight: currentBlockHeight,
                startingSupply,
                numBlocks: n,
                scenario,
                targetBlockSize,
                demandLevel,
                priceK,
                initialBaseFee,
                tipsGwei,
                use1559,
                minerMode,
                rngSeed
              });
              out[k] = { summary };
            } catch (err) {
              console.error('Simulation error:', err);
              out[k] = { summary: { simulatedBlocks:0, totalEmitted:0, totalBurned:0, totalToContract:0, totalMinerRevenue:0, totalBaseFeeRevenue:0, avgBaseFee:0, avgBaseFeeRevenue:0, finalSupply: startingSupply, netSupplyChange:0, avgBlockReward:0, avgBaseFeeToMiner:0, avgTips:0, avgPayForward:0, avgMinerRevenue:0, perMiner:Array.from({length:simulationConstants.NUM_MINERS},(_,i)=>({miner:i+1, blocksWon:0, avgRevenuePerWonBlock:0, totalRevenue:0})) } };
            }
          }
        }
        return out;
      }, [Sim, selectedScenarios, scenarios, selectedEra, targetBlockSize, demandLevel, priceK, initialBaseFee, tipsGwei, numBlocks, capChoice, use1559, minerMode, rngSeed, currentBlockHeight, safetyCap, startingSupply, simulationConstants.ERA_BLOCKS, simulationConstants.NUM_MINERS]);

      // Conditional render for loading
      if (!Sim) {
        return (
          <div className="max-w-7xl mx-auto p-6">
            <div className="text-center">
              <div className="text-2xl text-gray-300">Loading simulation engine...</div>
            </div>
          </div>
        );
      }

      // Constants
      const rewardForEra = Sim.rewardForEra;
      const supplyFromHeight = Sim.supplyFromHeight;
      const { ERA_BLOCKS, NUM_MINERS } = simulationConstants;

      const toggleScenario = (key) => {
        if (selectedScenarios.includes(key)) {
          if (selectedScenarios.length>1) setSelectedScenarios(selectedScenarios.filter(s=>s!==key));
        } else {
          setSelectedScenarios([...selectedScenarios, key]);
        }
      };

      const ScenarioCard = ({ scenarioKey, scenario, isSelected, onClick }) => (
        <button
          onClick={() => onClick(scenarioKey)}
          className={`panel greek-key p-4 rounded-lg border-2 transition-all text-left ${isSelected ? "border-emerald-500/70 bg-emerald-900/10" : "border-gray-700/60 bg-gray-900/40 hover:bg-gray-900/20"}`}
        >
          <div className="flex items-start gap-3">
            <span className="w-6 h-6 mt-1" style={{ color: scenario.color }}>{React.createElement(scenario.icon)}</span>
            <div className="flex-1">
              <h3 className="font-semibold text-white mb-1">{scenario.name}</h3>
              <p className="text-sm text-gray-300">{scenario.description}{!treasuryEnabled && scenario.contractFraction>0 ? " (Treasury disabled)" : ""}</p>
            </div>
            {isSelected && <div className="text-emerald-400 text-xl">✓</div>}
          </div>
        </button>
      );

      const RewardFlow = ({ keyId }) => {
        const s = scenarios[keyId], sum = scenarioResults[keyId].summary;
        const minerShareOfBase = 1 - s.burnFraction - s.contractFraction - s.payForwardFraction;
        const pct = (v)=> (sum.avgMinerRevenue>0 ? Math.round((v/sum.avgMinerRevenue)*100) : 0);
        return (
          <div className="panel greek-key rounded-lg p-6">
            <h4 className="text-sm font-semibold mb-4 text-center" style={{ color: s.color }}>
              Revenue Flow: {s.name}
            </h4>
            <div className="space-y-4">
              <div className="flex items-center gap-3">
                <div className="w-32 text-right text-sm text-gray-300">Block Reward</div>
                <span><I.ArrowRight/></span>
                <div className="flex-1 rounded p-2 border border-emerald-700/50 bg-emerald-900/10">
                  <div className="text-xs text-gray-400">Miner ({pct(sum.avgBlockReward)}% of total)</div>
                  <div className="font-semibold text-emerald-400">{sum.avgBlockReward.toFixed(6)} ETC/block</div>
                </div>
              </div>

              {sum.avgBaseFeeRevenue>0 && (
                <div className="flex items-start gap-3">
                  <div className="w-32 text-right text-sm text-gray-300 pt-2">Base Fee</div>
                  <span className="mt-2"><I.ArrowRight/></span>
                  <div className="flex-1 space-y-2">
                    <div className="rounded p-2 border border-gray-700 bg-gray-800/60">
                      <div className="text-xs text-gray-400">Avg Base Fee Collected</div>
                      <div className="font-semibold text-white">{sum.avgBaseFeeRevenue.toFixed(6)} ETC/block</div>
                    </div>
                    {s.burnFraction>0 && (
                      <div className="rounded p-2 border border-amber-700/60 bg-amber-900/20">
                        <div className="text-xs text-gray-300">Burned ({(s.burnFraction*100).toFixed(0)}%)</div>
                        <div className="font-semibold text-amber-300">{(sum.avgBaseFeeRevenue*s.burnFraction).toFixed(6)} ETC/block</div>
                      </div>
                    )}
                    {s.contractFraction>0 && (
                      <div className="rounded p-2 border border-emerald-700/60 bg-emerald-900/20">
                        <div className="text-xs text-gray-300">Treasury ({(s.contractFraction*100).toFixed(0)}%)</div>
                        <div className="font-semibold accent">{(sum.avgBaseFeeRevenue*s.contractFraction).toFixed(6)} ETC/block</div>
                      </div>
                    )}
                    {s.payForwardFraction>0 && (
                      <div className="rounded p-2 border border-cyan-700/60 bg-cyan-900/20">
                        <div className="text-xs text-gray-300">Pay Forward ({(s.payForwardFraction*100).toFixed(0)}%)</div>
                        <div className="font-semibold text-cyan-300">
                          {(sum.avgBaseFeeRevenue*s.payForwardFraction).toFixed(6)} ETC/block
                          <span className="block text-xs text-gray-400 mt-1">(drips over next {s.ellWindow} blocks)</span>
                        </div>
                      </div>
                    )}
                    {minerShareOfBase>0 && (
                      <div className="rounded p-2 border border-fuchsia-700/60 bg-fuchsia-900/20">
                        <div className="text-xs text-gray-300">To Miner ({(minerShareOfBase*100).toFixed(0)}%)</div>
                        <div className="font-semibold text-fuchsia-300">
                          {(sum.avgBaseFeeRevenue*minerShareOfBase).toFixed(6)} ETC/block
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}

              <div className="flex items-center gap-3">
                <div className="w-32 text-right text-sm text-gray-300">Tips</div>
                <span><I.ArrowRight/></span>
                <div className="flex-1 rounded p-2 border border-sky-700/60 bg-sky-900/20">
                  <div className="text-xs text-gray-400">Miner ({pct(sum.avgTips)}% of total)</div>
                  <div className="font-semibold text-sky-300">{sum.avgTips.toFixed(6)} ETC/block</div>
                </div>
              </div>

              {sum.avgPayForward>0 && (
                <div className="flex items-center gap-3">
                  <div className="w-32 text-right text-sm text-gray-300">Pay-Forward</div>
                  <span><I.ArrowRight/></span>
                  <div className="flex-1 rounded p-2 border border-cyan-700/60 bg-cyan-900/20">
                    <div className="text-xs text-gray-400">Miner</div>
                    <div className="font-semibold text-cyan-300">{sum.avgPayForward.toFixed(6)} ETC/block</div>
                  </div>
                </div>
              )}

              <div className="border-t border-gray-700 pt-3 mt-3">
                <div className="flex items-center justify-between">
                  <div className="text-sm font-semibold text-gray-300">Total Miner Revenue</div>
                  <div className="text-xl font-bold text-white">{sum.avgMinerRevenue.toFixed(6)} ETC/block</div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const SupplyCard = ({ keyId }) => {
        const s = scenarios[keyId], sum = scenarioResults[keyId].summary;
        const isDeflationary = sum.netSupplyChange < 0;
        const isNeutral = Math.abs(sum.netSupplyChange) < 1;
        return (
          <div className="panel greek-key rounded-lg p-6">
            <h4 className="text-sm font-semibold mb-4 text-center" style={{ color: s.color }}>
              Supply Impact: {s.name}
            </h4>
            <div className="space-y-4">
              <div className="text-center">
                <div className="text-3xl font-bold mb-2">
                  {isDeflationary ? (
                    <span className="text-red-300 inline-flex items-center gap-2">
                      <I.ArrowDown/> {Math.abs(sum.netSupplyChange).toFixed(2)} ETC
                    </span>
                  ) : isNeutral ? (
                    <span className="text-yellow-300 inline-flex items-center gap-2">
                      <I.Minus/> ~0 ETC
                    </span>
                  ) : (
                    <span className="text-emerald-300 inline-flex items-center gap-2">
                      <I.ArrowUp/> +{sum.netSupplyChange.toFixed(2)} ETC
                    </span>
                  )}
                </div>
                <div className="text-sm text-gray-300">
                  {isDeflationary ? "Supply Decreased" : isNeutral ? "Supply Stable" : "Supply Increased"}
                </div>
              </div>
              <div className="grid grid-cols-2 gap-3 text-sm">
                <div className="bg-gray-900/60 p-3 rounded border border-gray-800">
                  <div className="text-gray-400 mb-1">Starting</div>
                  <div className="font-semibold">{supplyFromHeight(selectedEra*ERA_BLOCKS).toLocaleString()}</div>
                </div>
                <div className="bg-gray-900/60 p-3 rounded border border-gray-800">
                  <div className="text-gray-400 mb-1">Final</div>
                  <div className="font-semibold">{sum.finalSupply.toLocaleString()}</div>
                </div>
                <div className="bg-gray-900/60 p-3 rounded border border-gray-800">
                  <div className="text-gray-400 mb-1">Emitted</div>
                  <div className="font-semibold text-emerald-300">+{sum.totalEmitted.toFixed(4)}</div>
                </div>
                <div className="bg-gray-900/60 p-3 rounded border border-gray-800">
                  <div className="text-gray-400 mb-1">Burned</div>
                  <div className="font-semibold text-amber-300">-{sum.totalBurned.toFixed(4)}</div>
                </div>
              </div>
              {s.contractFraction>0 && (
                <div className="rounded p-3 border border-emerald-700/50 bg-emerald-900/15">
                  <div className="text-xs text-gray-300 mb-1">Treasury Accumulated</div>
                  <div className="text-lg font-bold accent">{scenarioResults[keyId].summary.totalToContract.toFixed(4)} ETC</div>
                </div>
              )}
            </div>
          </div>
        );
      };

      // ===== RENDER =====
      return (
        <div className="max-w-7xl mx-auto p-6">
          <div className="text-center mb-8">
            <div className="title-font text-4xl md:text-5xl font-bold mb-2 gold flex items-center justify-center gap-3">
              <I.Laurel/> ETC • OLYMPIA <span className="accent">Σ</span>CENARIOS <I.Laurel/>
            </div>
            <p className="text-gray-300 mb-2">
              A community tool to explore fee mechanism policies on Ethereum Classic
            </p>
            <p className="text-sm text-gray-400">
              Compare how different revenue distribution models affect miners, supply, and ecosystem funding
            </p>
          </div>

          {/* Top switches */}
          <div className="grid md:grid-cols-2 gap-4 mb-8">
            <div className="panel greek-key rounded-lg p-4">
              <div className="flex items-center justify-between">
                <div className="flex-1">
                  <div className="title-font text-lg gold flex items-center">
                    Fee Mechanism
                    <InfoTooltip title="Fee Mechanism Overview">
                      <p><strong>EIP-1559:</strong> Dynamic pricing where the base fee adjusts each block (±12.5%) based on demand. Blocks can expand to 2x the target if demand is high.</p>
                      <p className="mt-2"><strong>Pre-1559:</strong> Fixed block size limit. No base fee mechanism—only miner tips.</p>
                      <p className="mt-2">Use EIP-1559 to simulate modern fee markets. Use Pre-1559 to see legacy pricing behavior.</p>
                    </InfoTooltip>
                  </div>
                  <div className="text-sm text-gray-300">{use1559 ? "EIP-1559: Dynamic base fee + elastic blocks" : "Pre-1559: Fixed gas limit + tips only"}</div>
                </div>
                <button
                  onClick={()=>setUse1559(!use1559)}
                  className={`px-5 py-2 rounded border ${use1559 ? "border-emerald-500 text-white bg-emerald-700/30" : "border-gray-600 text-gray-200 bg-gray-800"}`}
                >
                  {use1559 ? "EIP-1559" : "Pre-1559"}
                </button>
              </div>
            </div>

            <div className="panel greek-key rounded-lg p-4">
              <div className="flex items-center justify-between">
                <div className="flex-1">
                  <div className="title-font text-lg gold flex items-center">
                    Treasury Support
                    <InfoTooltip title="Treasury Toggle">
                      <p>Enable/disable ecosystem treasury funding. When enabled, a portion of base fees can be directed to a treasury contract to fund ETC development.</p>
                      <p className="mt-2">Toggle this to see how treasury policies affect miner revenue and total ecosystem funding.</p>
                    </InfoTooltip>
                  </div>
                  <div className="text-sm text-gray-300">{treasuryEnabled ? "Treasury enabled" : "Treasury disabled"}</div>
                </div>
                <button
                  onClick={()=>setTreasuryEnabled(!treasuryEnabled)}
                  className={`px-5 py-2 rounded border ${treasuryEnabled ? "border-amber-400 text-white bg-amber-700/30" : "border-gray-600 text-gray-200 bg-gray-800"}`}
                >
                  {treasuryEnabled ? "On" : "Off"}
                </button>
              </div>
            </div>
          </div>

          <div className="mb-8">
            <div className="title-font text-xl mb-3 accent flex items-center">
              Select Scenarios
              <InfoTooltip title="Fee Policy Scenarios">
                <p>Each scenario represents a different policy for allocating base fee revenue:</p>
                <ul className="list-disc list-inside mt-2 space-y-1 text-gray-300">
                  <li><strong>Classic:</strong> All base fees go to miners (pre-treasury approach)</li>
                  <li><strong>Burn:</strong> All base fees burned (like Ethereum, deflationary)</li>
                  <li><strong>Olympia:</strong> All base fees to treasury (ecosystem funding)</li>
                  <li><strong>Blended:</strong> 50/50 split between miners and treasury</li>
                  <li><strong>ℓ-Smoothed:</strong> Gradual distribution over time for stability</li>
                </ul>
                <p className="mt-2">Select multiple scenarios to compare side-by-side.</p>
              </InfoTooltip>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {Object.entries(scenarios).map(([k,s])=>(
                <ScenarioCard key={k} scenarioKey={k} scenario={s} isSelected={selectedScenarios.includes(k)} onClick={()=>toggleScenario(k)}/>
              ))}
            </div>
          </div>

          <div className="panel greek-key rounded-lg p-6 mb-8">
            <div className="title-font text-xl mb-4 accent flex items-center">
              Simulation Parameters
              <InfoTooltip title="How Simulations Work">
                <p>Adjust these parameters to model different network conditions and measure their impact on revenue distribution.</p>
                <p className="mt-2"><strong>Era:</strong> ECIP-1017 halves the block reward every 5M blocks (era). Earlier eras have higher rewards.</p>
                <p className="mt-2"><strong>Demand & Price:</strong> Higher demand means fuller blocks and rising base fees. Price sensitivity (K) controls elasticity.</p>
                <p className="mt-2"><strong>Length:</strong> Number of blocks to simulate. More blocks = more accurate statistics (but slower).</p>
              </InfoTooltip>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              <div>
                <label className="text-sm font-medium flex items-center">
                  Starting Era
                  <InfoTooltip title="ECIP-1017 Era Selection">
                    <p>ECIP-1017 reduces block rewards by 20% every 5,000,000 blocks:</p>
                    <ul className="list-disc list-inside mt-2 space-y-1 text-gray-300">
                      <li>Era 0: 5.0 ETC/block</li>
                      <li>Era 1: 4.0 ETC/block</li>
                      <li>Era 2: 3.2 ETC/block</li>
                      <li>...and so on</li>
                    </ul>
                    <p className="mt-2">Select an era to see how policies impact supply at different reward levels.</p>
                  </InfoTooltip>
                </label>
                <select className="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-2" value={selectedEra} onChange={(e)=>setSelectedEra(parseInt(e.target.value))}>
                  {[...Array(11).keys()].map(era => (
                    <option key={era} value={era}>Era {era} ({rewardForEra(era).toFixed(3)} ETC/block)</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="text-sm font-medium flex items-center">
                  Target Block Size (Mgas)
                  <InfoTooltip title="Block Size Target">
                    <p>Under EIP-1559, this is the equilibrium point:</p>
                    <ul className="list-disc list-inside mt-2 space-y-1 text-gray-300">
                      <li>Gas used &lt; target: base fee decreases</li>
                      <li>Gas used = target: base fee stays constant</li>
                      <li>Gas used &gt; target: base fee increases</li>
                    </ul>
                    <p className="mt-2">Blocks can expand to 2x this target when demand is high.</p>
                  </InfoTooltip>
                </label>
                <input type="range" min="5" max="30" step="1" value={targetBlockSize} onChange={(e)=>setTargetBlockSize(parseFloat(e.target.value))} className="w-full" style={{accentColor:"var(--etc-green)"}} />
                <div className="text-right text-sm text-gray-400 mt-1">{targetBlockSize}M (max: {use1559 ? targetBlockSize*2 : targetBlockSize}M)</div>
              </div>

              <div>
                <label className="text-sm font-medium flex items-center">
                  Baseline Demand (Mgas)
                  <InfoTooltip title="User Demand">
                    <p>Average gas demanded by users per block before pricing effects.</p>
                    <p className="mt-2">Higher demand → fuller blocks → higher base fees.</p>
                    <p className="mt-2">Realistic values: 10-25M gas for moderate network activity.</p>
                  </InfoTooltip>
                </label>
                <input type="range" min="1" max="40" step="1" value={demandLevel} onChange={(e)=>setDemandLevel(parseFloat(e.target.value))} className="w-full" style={{accentColor:"var(--etc-green)"}} />
                <div className="text-right text-sm text-gray-400 mt-1">{demandLevel}M</div>
              </div>

              <div>
                <label className="text-sm font-medium flex items-center">
                  Price Sensitivity (K, gwei)
                  <InfoTooltip title="Demand Elasticity">
                    <p>Controls how much demand decreases as price (base fee) increases.</p>
                    <p className="mt-2">When base fee reaches K, demand drops to 50% of baseline.</p>
                    <p className="mt-2">Lower K = users more price-sensitive (demand drops faster).</p>
                    <p className="mt-2">Higher K = users less sensitive (demand sticky).</p>
                  </InfoTooltip>
                </label>
                <input type="range" min="10" max="200" step="5" value={priceK} onChange={(e)=>setPriceK(parseFloat(e.target.value))} className="w-full" style={{accentColor:"var(--etc-green)"}} />
                <div className="text-right text-sm text-gray-400 mt-1">K = {priceK} gwei</div>
              </div>

              <div>
                <label className="text-sm font-medium flex items-center">
                  Initial Base Fee (gwei)
                  <InfoTooltip title="Starting Base Fee">
                    <p>The base fee at the start of simulation.</p>
                    <p className="mt-2">It will adjust each block by up to ±12.5% depending on demand.</p>
                    <p className="mt-2">Realistic values: 10-100 gwei.</p>
                  </InfoTooltip>
                </label>
                <input type="range" min="0" max="500" step="1" value={initialBaseFee} onChange={(e)=>setInitialBaseFee(parseFloat(e.target.value))} className="w-full" style={{accentColor:"var(--etc-green)"}} />
                <div className="text-right text-sm text-gray-400 mt-1">{initialBaseFee} gwei</div>
              </div>

              <div>
                <label className="text-sm font-medium flex items-center">
                  Tips per Gas (gwei)
                  <InfoTooltip title="Priority Tips">
                    <p>Priority fee (tip) paid by users for fast inclusion.</p>
                    <p className="mt-2">Tips are <strong>always</strong> given to miners, never burned or sent to treasury.</p>
                    <p className="mt-2">Realistic values: 1-5 gwei.</p>
                  </InfoTooltip>
                </label>
                <input type="range" min="0" max="10" step="0.1" value={tipsGwei} onChange={(e)=>setTipsGwei(parseFloat(e.target.value))} className="w-full" style={{accentColor:"var(--etc-green)"}} />
                <div className="text-right text-sm text-gray-400 mt-1">{tipsGwei.toFixed(1)} gwei</div>
              </div>

              <div>
                <label className="text-sm font-medium flex items-center">
                  Simulation Length (blocks)
                  <InfoTooltip title="Simulation Length">
                    <p>Number of blocks to simulate. Capped at 1 era (5M blocks) for safety.</p>
                    <p className="mt-2">More blocks = better statistics but slower computation.</p>
                    <p className="mt-2">Typical: 100k-500k blocks for good accuracy.</p>
                  </InfoTooltip>
                </label>
                <input type="range" min="0" max="5000000" step="10000" value={numBlocks} onChange={(e)=>setNumBlocks(parseInt(e.target.value))} className="w-full" style={{accentColor:"var(--etc-green)"}} />
                <div className="text-right text-sm text-gray-400 mt-1">{(numBlocks/1000).toFixed(0)}k blocks</div>
              </div>

              <div>
                <label className="text-sm font-medium flex items-center">
                  Miner Distribution
                  <InfoTooltip title="Block Producer Models">
                    <ul className="list-disc list-inside mt-2 space-y-1 text-gray-300">
                      <li><strong>Equal:</strong> All 5 miners win ~20% each (fair distribution)</li>
                      <li><strong>Weighted:</strong> 40/30/20/5/5 distribution (concentration)</li>
                      <li><strong>Automaton:</strong> Rule-110 cellular automaton (chaotic churn)</li>
                    </ul>
                    <p className="mt-2">Compare how concentration affects revenue variance.</p>
                  </InfoTooltip>
                </label>
                <select className="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-2" value={minerMode} onChange={(e)=>setMinerMode(e.target.value)}>
                  <option value="equal">Equal Distribution</option>
                  <option value="weighted">Weighted (40/30/20/5/5)</option>
                  <option value="automaton">Cellular Automaton</option>
                </select>
              </div>

              <div>
                <label className="text-sm font-medium flex items-center">
                  Random Seed
                  <InfoTooltip title="Deterministic Randomness">
                    <p>Seeds the RNG for weighted and automaton modes.</p>
                    <p className="mt-2">Same seed = same miner sequence (reproducible).</p>
                    <p className="mt-2">Different seed = different sequence to explore variance.</p>
                  </InfoTooltip>
                </label>
                <input type="number" className="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-2" value={rngSeed} onChange={(e)=>setRngSeed(parseInt(e.target.value||'1'))}/>
              </div>
            </div>
          </div>

          {/* Results */}
          <div className="space-y-8">
            {selectedScenarios.map((k)=>{
              const s = scenarios[k];
              const res = scenarioResults[k];
              if (!res) return null;
              return (
                <div key={k} className="panel greek-key rounded-lg p-6" style={{ borderColor: s.color }}>
                  <h3 className="title-font text-2xl font-bold mb-4" style={{ color: s.color }}>{s.name}</h3>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                    <RewardFlow keyId={k}/>
                    <SupplyCard keyId={k}/>
                  </div>

                  <div>
                    <div className="text-sm font-semibold text-gray-200 mb-2">Per-Miner Results</div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-sm">
                        <thead>
                          <tr className="border-b border-gray-800">
                            <th className="text-left p-2">Miner</th>
                            <th className="text-right p-2">Blocks Won</th>
                            <th className="text-right p-2">Avg Revenue (ETC)</th>
                            <th className="text-right p-2">Total Revenue (ETC)</th>
                          </tr>
                        </thead>
                        <tbody>
                          {res.summary.perMiner.map(r=>(
                            <tr key={r.miner} className="border-b border-gray-900/40">
                              <td className="p-2">Miner {r.miner}</td>
                              <td className="p-2 text-right">{r.blocksWon}</td>
                              <td className="p-2 text-right">{r.avgRevenuePerWonBlock.toFixed(6)}</td>
                              <td className="p-2 text-right">{r.totalRevenue.toFixed(6)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Comparison Table */}
          <div className="panel greek-key rounded-lg p-6 mt-8 mb-8">
            <div className="title-font text-xl mb-4 accent flex items-center">
              Scenario Comparison
              <InfoTooltip title="Reading the Comparison">
                <p>This table summarizes key metrics across all selected scenarios.</p>
                <p className="mt-2"><strong>Avg Miner Revenue:</strong> Average ETC earned per block per miner.</p>
                <p className="mt-2"><strong>Total Miner Revenue:</strong> Cumulative ETC earned by all miners across all blocks.</p>
                <p className="mt-2"><strong>Treasury Accumulated:</strong> Total ETC directed to ecosystem treasury.</p>
                <p className="mt-2"><strong>Supply Change:</strong> Net positive (inflation) or negative (deflation) change to ETC supply.</p>
                <p className="mt-2">Use this to identify trade-offs between miner incentives, ecosystem funding, and supply dynamics.</p>
              </InfoTooltip>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="border-b border-gray-800">
                    <th className="text-left p-3 text-gray-400">Metric</th>
                    {selectedScenarios.map(k=>(
                      <th key={k} className="text-right p-3" style={{ color: scenarios[k].color }}>{scenarios[k].name}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  <tr className="border-b border-gray-900/40">
                    <td className="p-3 text-gray-300">Avg Miner Revenue / Block</td>
                    {selectedScenarios.map(k=>(
                      <td key={k} className="text-right p-3 font-semibold">{scenarioResults[k].summary.avgMinerRevenue.toFixed(6)} ETC</td>
                    ))}
                  </tr>
                  <tr className="border-b border-gray-900/40">
                    <td className="p-3 text-gray-300">Avg Block Reward</td>
                    {selectedScenarios.map(k=>(
                      <td key={k} className="text-right p-3">{scenarioResults[k].summary.avgBlockReward.toFixed(6)} ETC</td>
                    ))}
                  </tr>
                  <tr className="border-b border-gray-900/40">
                    <td className="p-3 text-gray-300">Avg Base Fee / Block</td>
                    {selectedScenarios.map(k=>(
                      <td key={k} className="text-right p-3">{scenarioResults[k].summary.avgBaseFeeRevenue.toFixed(6)} ETC</td>
                    ))}
                  </tr>
                  <tr className="border-b border-gray-900/40">
                    <td className="p-3 text-gray-300">Avg Tips / Block</td>
                    {selectedScenarios.map(k=>(
                      <td key={k} className="text-right p-3">{scenarioResults[k].summary.avgTips.toFixed(6)} ETC</td>
                    ))}
                  </tr>
                  <tr className="border-b border-gray-900/40">
                    <td className="p-3 text-gray-300">Total Miner Revenue</td>
                    {selectedScenarios.map(k=>(
                      <td key={k} className="text-right p-3 text-sky-300 font-semibold">{scenarioResults[k].summary.totalMinerRevenue.toFixed(4)} ETC</td>
                    ))}
                  </tr>
                  <tr className="border-b border-gray-900/40">
                    <td className="p-3 text-gray-300">Total Emitted</td>
                    {selectedScenarios.map(k=>(
                      <td key={k} className="text-right p-3 text-emerald-300">{scenarioResults[k].summary.totalEmitted.toFixed(4)} ETC</td>
                    ))}
                  </tr>
                  <tr className="border-b border-gray-900/40">
                    <td className="p-3 text-gray-300">Total Burned</td>
                    {selectedScenarios.map(k=>(
                      <td key={k} className="text-right p-3 text-amber-300">{scenarioResults[k].summary.totalBurned.toFixed(4)} ETC</td>
                    ))}
                  </tr>
                  <tr className="border-b border-gray-900/40">
                    <td className="p-3 text-gray-300">Treasury Accumulated</td>
                    {selectedScenarios.map(k=>(
                      <td key={k} className="text-right p-3 accent font-semibold">{scenarioResults[k].summary.totalToContract.toFixed(4)} ETC</td>
                    ))}
                  </tr>
                  <tr className="border-b border-gray-900/40">
                    <td className="p-3 text-gray-300">Avg Base Fee (price)</td>
                    {selectedScenarios.map(k=>(
                      <td key={k} className="text-right p-3">{scenarioResults[k].summary.avgBaseFee.toFixed(2)} gwei</td>
                    ))}
                  </tr>
                  <tr>
                    <td className="p-3 text-gray-300 font-semibold">Net Supply Change</td>
                    {selectedScenarios.map(k=>{
                      const ch = scenarioResults[k].summary.netSupplyChange;
                      return (
                        <td key={k} className="text-right p-3 font-semibold">
                          <span className={ch<0?"text-red-300":ch>1?"text-emerald-300":"text-yellow-300"}>
                            {ch>0?"+":""}{ch.toFixed(2)} ETC
                          </span>
                        </td>
                      );
                    })}
                  </tr>
                </tbody>
              </table>
            </div>
            <div className="mt-4 text-xs text-gray-400 space-y-1">
              <p><strong>Key Insights:</strong></p>
              <p>• Compare "Total Miner Revenue" to see which scenarios incentivize mining most</p>
              <p>• Compare "Treasury Accumulated" to see funding potential for ecosystem development</p>
              <p>• Compare "Net Supply Change" to see deflationary (burn) vs. inflationary (issuance) effects</p>
              <p>• Compare "Avg Base Fee" to see pricing dynamics and user experience</p>
            </div>
          </div>

          <div className="text-center text-gray-400 text-sm border-t border-gray-800 pt-6 mt-8">
            <p className="mb-2"><strong className="gold">ECIP-1017 Monetary Policy:</strong> 5M blocks/era, −20% reward reduction per era</p>
            <p className="text-xs text-gray-500">Units: gwei × gas × 1e-9 = ETC • Made with ❤️ for the ETC community</p>
          </div>
        </div>
      );
    }

    // Render
    try {
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    } catch (e) {
      const box = document.getElementById('errbox');
      box.style.display = 'block';
      box.textContent = String(e && e.message ? e.message : e);
      console.error(e);
    }
  </script>
</body>
</html>
