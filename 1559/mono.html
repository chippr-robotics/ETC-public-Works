<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ETC Fee Mechanism Scenario Explorer — Olympia Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --etc-green:#3ab83a;
      --olympic-gold:#d4af37;
    }
    body {
      background:
        radial-gradient(1000px 600px at 20% -10%, #0c0e10, transparent),
        radial-gradient(800px 500px at 120% 10%, #0b0d0f, transparent),
        linear-gradient(180deg, #0a0c0e, #0b0d10);
    }
    .title-font { font-family: "Cinzel", serif; letter-spacing: 0.02em; }
    .ui-font { font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial; }
    .greek-key { position: relative; border: 1px solid rgba(212,175,55,0.25); }
    .greek-key:before { content:""; position:absolute; inset:6px; border:1px solid rgba(212,175,55,0.18); pointer-events:none; }
    .panel { background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00)); }
    .gold { color: var(--olympic-gold); }
    .accent { color: var(--etc-green); }
    .tooltip-panel { z-index: 60; }
    #errbox { display:none; white-space:pre-wrap; }
  </style>
</head>
<body class="ui-font text-white">
  <div id="root"></div>
  <pre id="errbox" class="m-4 p-4 bg-red-950/40 border border-red-700/50 rounded text-red-200 text-sm"></pre>

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react,env">
    // Small, documented single-file React app. The goal here is to keep the simulation
    // logic readable and well-commented so contributors can understand each part of the model.
    const { useState, useMemo } = React;

    // tiny inline emoji icons (keeps the file standalone)
    const I = {
      Info: (p)=><span {...p}>ℹ️</span>,
      Users:(p)=><span {...p}>👥</span>,
      Flame:(p)=><span {...p}>🔥</span>,
      Lock:(p)=><span {...p}>🔒</span>,
      ArrowRight:(p)=><span {...p}>➡️</span>,
      TrendingUp:(p)=><span {...p}>📈</span>,
      ArrowDown:(p)=><span {...p}>⬇️</span>,
      ArrowUp:(p)=><span {...p}>⬆️</span>,
      Minus:(p)=><span {...p}>➖</span>,
      Laurel:(p)=><span {...p}>🏛️</span>,
    };

    // Reusable info tooltip component (small visual helper)
    const InfoTooltip = ({ title, children }) => (
      <span className="group relative inline-flex items-center ml-2 align-middle">
        <span className="text-slate-300">ℹ️</span>
        <span className="tooltip-panel invisible group-hover:visible absolute w-80 p-3 mt-2 text-sm text-white bg-gray-800 rounded-lg shadow-lg -left-32">
          <div className="font-semibold mb-1">{title}</div>
          <div className="text-gray-300">{children}</div>
        </span>
      </span>
    );

    function App() {
      // ===== Constants / Units / Guards =====
      // GWEI_TO_ETC: conversion factor to turn gwei * gas into ETC (gwei * gas * 1e-9 = ETC)
      const GWEI_TO_ETC = 1e-9;
      // M_GAS: one "Mgas" (1e6 gas)
      const M_GAS = 1_000_000;

      // ECIP-1017 era parameters (monetary policy)
      const ERA_BLOCKS = 5_000_000;      // blocks per era
      const ERA_REDUCTION = 0.20;        // reward reduces by 20% each era
      const INITIAL_REWARD = 5;          // genesis per-block reward (ETC)
      const GENESIS_SUPPLY = 72_000_000; // starting supply baseline (ETC)

      // Clamp for base fee (Gwei) used to avoid runaway/infinite values in pathological simulations
      const MAX_BASE_FEE_GWEI = 100_000;

      // Number of miners in the per-miner breakdown. Kept small for display clarity.
      const miners = 5;

      // ===== Scenarios (raw) =====
      // These objects describe how base fee revenue is split in different policy variants:
      // - burnFraction: immediate burn (reduces supply)
      // - contractFraction: sent to treasury/contract (accumulates off-chain in this simulation)
      // - payForwardFraction: proportion that is distributed across next ℓ blocks (smoothing)
      // - ellWindow: ℓ window (number of blocks) for pay-forward smoothing
      const baseScenarios = {
        classic: {
          name:"EIP-1559 No Burn/Treasury",
          description:"Base fee goes 100% to miners (not burned)",
          burnFraction:0.0, contractFraction:0.0, payForwardFraction:0.0, ellWindow:0,
          icon:I.Lock, color:"#6B7280"
        },
        burn: {
          name:"EIP-1559 Burn Model",
          description:"Like Ethereum: Base fee burned, reducing supply",
          burnFraction:1.0, contractFraction:0.0, payForwardFraction:0.0, ellWindow:0,
          icon:I.Flame, color:"#F59E0B"
        },
        olympia: {
          name:"Olympia Treasury",
          description:"Base fee → Treasury contract for ecosystem funding",
          burnFraction:0.0, contractFraction:1.0, payForwardFraction:0.0, ellWindow:0,
          icon:I.Users, color:"#3ab83a"
        },
        blended: {
          name:"Blended (50/50)",
          description:"Half to miner, half to treasury (no burn)",
          burnFraction:0.0, contractFraction:0.5, payForwardFraction:0.0, ellWindow:0,
          icon:I.TrendingUp, color:"#8B5CF6"
        },
        lsmoothed: {
          name:"ℓ-Smoothed Security",
          description:"25% treasury, 75% distributed over next ℓ blocks",
          burnFraction:0.0, contractFraction:0.25, payForwardFraction:0.75, ellWindow:100,
          icon:I.ArrowRight, color:"#06B6D4"
        }
      };

      // UI state for which scenarios are displayed by default
      const [selectedScenarios, setSelectedScenarios] = useState(["classic","olympia","burn"]);
      // Whether the treasury distribution is enabled (global toggle that affects contractFraction)
      const [treasuryEnabled, setTreasuryEnabled] = useState(true);

      // Build the active scenarios object while respecting the treasuryEnabled toggle.
      // This keeps original scenario definitions immutable while allowing UI-driven toggling.
      const scenarios = useMemo(()=>{
        const out = {};
        for (const [k, s] of Object.entries(baseScenarios)) {
          // If treasury is disabled, force contractFraction to 0
          out[k] = { ...s, contractFraction: treasuryEnabled ? s.contractFraction : 0 };
        }
        return out;
      }, [treasuryEnabled]);

      // ===== Era selection (radio buttons) =====
      // selectedEra: integer era number used to derive starting block and supply
      const [selectedEra, setSelectedEra] = useState(4);
      const currentBlockHeight = selectedEra * ERA_BLOCKS;

      // ===== Network params (tunable sliders) =====
      const [targetBlockSize, setTargetBlockSize] = useState(15);   // target in Mgas
      const [demandLevel, setDemandLevel] = useState(20);          // baseline demand in Mgas
      const [priceK, setPriceK] = useState(50);                   // price sensitivity K (gwei)
      const [initialBaseFee, setInitialBaseFee] = useState(50);   // starting base fee (gwei)
      const [tipsGwei, setTipsGwei] = useState(2);                // priority tips per gas (gwei)

      // ===== Simulation length & safety =====
      // numBlocks: requested number of blocks to simulate
      const [numBlocks, setNumBlocks] = useState(100_000);
      // capChoice determines a safety cap applied to the simulation (to avoid very long runs)
      const [capChoice, setCapChoice] = useState("500k"); // "500k" | "2.5m" | "none"
      const safetyCap = capChoice==="500k" ? 500_000 : capChoice==="2.5m" ? 2_500_000 : Infinity;
      // Whether to use EIP-1559 logic (base fee + elastic blocks) or pre-1559 (fixed limit, only tips)
      const [use1559, setUse1559] = useState(true);

      // Computed maximum gas per block (elastic expansion under 1559 doubles max)
      const maxBlockSize = use1559 ? targetBlockSize * 2 : targetBlockSize;

      // ===== Monetary helpers (functions that describe ECIP-1017 schedule) =====

      // rewardForEra: reward per block at a given era (geometric decay: initial * (1-0.2)^era)
      const rewardForEra = (era) => INITIAL_REWARD * Math.pow(1 - ERA_REDUCTION, era);

      // issuedThroughFullEras: total coins emitted across all full eras prior to 'era'
      // Uses geometric series summation for efficiency and accuracy.
      const issuedThroughFullEras = (era) => {
        if (era <= 0) return 0;
        const r = 1 - ERA_REDUCTION;
        return ERA_BLOCKS * INITIAL_REWARD * ((1 - Math.pow(r, era)) / (1 - r));
      };

      // issuanceAtBlock: cumulative issuance through block height h
      // - Compute the number of full eras before h, then add in-era issuance for partial era.
      const issuanceAtBlock = (h) => {
        const era = Math.floor(h / ERA_BLOCKS);
        const inEra = h % ERA_BLOCKS;
        return issuedThroughFullEras(era) + inEra * rewardForEra(era);
      };

      // supplyFromHeight: derived supply (GENESIS + issuance) at block height h
      const supplyFromHeight = (h) => GENESIS_SUPPLY + issuanceAtBlock(h);

      // Precompute starting supply for the selected era (used as baseline for delta calculations)
      const startingSupply = useMemo(()=> supplyFromHeight(currentBlockHeight), [currentBlockHeight]);

      // Era snapshot helpers for UI (not used in simulation core but helpful to display)
      const eraReward = rewardForEra(selectedEra);
      const eraStart = currentBlockHeight;
      const eraEnd = eraStart + ERA_BLOCKS - 1;
      const eraStartSupply = startingSupply;
      const eraEndSupply = eraStartSupply + ERA_BLOCKS * eraReward;

      // ===== Miner distribution settings =====
      const [minerMode, setMinerMode] = useState("equal"); // "equal" | "weighted" | "automaton"
      const [rngSeed, setRngSeed] = useState(1);          // deterministic seed for rand modes

      // ===== Demand & base fee helpers =====

      // safeNum: small helper to ensure numeric safety (avoid NaN/infinite)
      const safeNum = (x, fb=0)=> Number.isFinite(x) ? x : fb;

      // updateBaseFee: EIP-1559 base fee adjustment rule (simple discrete approximation)
      // - prev: previous base fee (gwei)
      // - gasUsed: gas used in the block (absolute gas units)
      // - targetGas: target gas for adjustment (Mgas * 1e6)
      //
      // Implementation notes:
      // - This approximates the ±12.5% per-block adjustment by computing a proportional
      //   increment capped by a maxChangeDen denominator (8 -> ±12.5%).
      // - Clamps to [0, MAX_BASE_FEE_GWEI] to prevent runaway values in extreme parameter sets.
      const updateBaseFee = (prev, gasUsed, targetGas) => {
        if (!use1559) return 0; // pre-1559 mode has no base fee
        const delta = gasUsed - targetGas;
        if (delta === 0) return prev;
        const maxChangeDen = 8; // ±12.5% (1/8)
        const amount = Math.floor((Math.abs(prev) * Math.abs(delta)) / Math.max(1, targetGas) / maxChangeDen);
        let next = delta > 0 ? prev + Math.max(1, amount) : prev - Math.max(1, amount);
        if (next < 0) next = 0;
        if (next > MAX_BASE_FEE_GWEI) next = MAX_BASE_FEE_GWEI; // clamp to safe upper bound
        return next;
      };

      // demandAfterPrice: simple price-elastic demand model
      // - baselineMgas: baseline demand (Mgas)
      // - baseFeeGwei: base fee price (gwei)
      //
      // This uses an inverse relation 1/(1 + baseFee/K) to reduce demand as base fee grows.
      const demandAfterPrice = (baselineMgas, baseFeeGwei) => {
        const factor = 1 / (1 + safeNum(baseFeeGwei / Math.max(1e-9, priceK), 0));
        return Math.max(0, baselineMgas * factor);
      };

      // ===== RNG / miner pickers =====

      // makeLCG: deterministic linear congruential generator seeded with an integer.
      // - returns a function that yields pseudo-random values in [0,1)
      // - Used to make weighted miner selection deterministic/reproducible.
      const makeLCG = (seed) => {
        let s = seed >>> 0;
        return () => { s = (1664525 * s + 1013904223) >>> 0; return s / 0xffffffff; };
      };

      // pickWeightedMiner: sample a miner index given an LCG 'rand' function and fixed weights.
      // Here weights are implicit via thresholds (0.40, 0.30, 0.20, 0.05, 0.05).
      const pickWeightedMiner = (rand) => {
        const r = rand();
        if (r < 0.40) return 0;
        if (r < 0.70) return 1;
        if (r < 0.90) return 2;
        if (r < 0.95) return 3;
        return 4;
      };

      // pickEqualMiner: deterministic round-robin-like mapping from block index to miner
      const pickEqualMiner = (i) => i % miners;

      // RULE_110: elementary cellular automaton function (Rule 110)
      // Used to produce complex-but-deterministic binary streams for the automaton miner picker.
      const RULE_110 = (n) =>
        n===0b111?0 : n===0b110?1 : n===0b101?1 : n===0b100?0 :
        n===0b011?1 : n===0b010?1 : n===0b001?1 : 0;

      // makeRule110Picker: builds a miner-picker driven by a Rule-110 automaton with
      // additional "churn" windows to simulate miners becoming inactive for short periods.
      // - seed: used to initialize the automaton state, churn phases and produce returns.
      // - returns a function that yields a miner index (0..miners-1) on each call.
      const makeRule110Picker = (seed) => {
        const rand = makeLCG(seed);
        const N=32;
        // initialize automaton state with pseudorandom bits
        let state = Array.from({length:N},()=> rand()<0.5?1:0);
        // churn config for each miner: phase, period, window length (inactive window)
        const churn = Array.from({length:miners},(_,m)=>({
          phase:Math.floor(rand()*200), period:400+m*37, window:40+m*7
        }));
        let t=0;
        const active=(m)=>{
          const {phase,period,window} = churn[m];
          const x=(t+phase)%period;
          return !(x<window); // miner inactive in small window, otherwise active
        };
        return ()=>{
          // advance automaton one step
          const next = new Array(N);
          for(let i=0;i<N;i++){
            const L=state[(i-1+N)%N], C=state[i], R=state[(i+1)%N];
            next[i]=RULE_110((L<<2)|(C<<1)|R);
          }
          state=next;
          // fold state to 32-bit hash value and map to miner index
          let h=0; for(let i=0;i<N;i++) h=(h*131+state[i])>>>0;
          let idx=h%miners;
          // if the chosen miner is inactive, walk forward to the next active miner
          if(!active(idx)){
            for(let k=0;k<miners;k++){ idx=(idx+1)%miners; if(active(idx)) break; }
          }
          t++;
          return idx;
        };
      };

      // ===== Simulation (summary-only) =====
      // simulateSummary runs a block-by-block simulation for a selected scenario and returns
      // aggregate metrics (averages, totals, per-miner breakdown). This implementation
      // focuses on clarity rather than micro-optimizations.
      function simulateSummary(scenario) {
        // requested number of blocks (coerced to non-negative)
        const requested = Math.max(0, numBlocks);
        // n: actual simulated blocks limited by: requested, safety cap, 1 era (ERA_BLOCKS)
        const n = Math.min(requested, safetyCap, ERA_BLOCKS);
        if (n === 0) {
          // Return a zeroed summary object when there's nothing to simulate
          return {
            summary:{
              simulatedBlocks:0, totalEmitted:0,totalBurned:0,totalToContract:0,totalMinerRevenue:0,
              totalBaseFeeRevenue:0, avgBaseFee:use1559?initialBaseFee:0, avgBaseFeeRevenue:0,
              finalSupply: startingSupply, netSupplyChange:0, avgBlockReward:0, avgBaseFeeToMiner:0,
              avgTips:0, avgPayForward:0, avgMinerRevenue:0, perMiner:Array.from({length:miners},(_,i)=>({
                miner:i+1, blocksWon:0, avgRevenuePerWonBlock:0, totalRevenue:0
              }))
            }
          };
        }

        // Per-miner accumulators
        const minerRev = new Array(miners).fill(0);
        const minerBlocks = new Array(miners).fill(0);

        // Deterministic random for weighted mode & RNG-fueled automaton init
        const rand = makeLCG(rngSeed);
        const pickAutomaton = makeRule110Picker(rngSeed);
        // pickWinner chooses which miner wins each block according to minerMode
        const pickWinner = (i) => {
          if (minerMode==="equal") return pickEqualMiner(i);
          if (minerMode==="weighted") return pickWeightedMiner(rand);
          return pickAutomaton();
        };

        // Initialize key simulation variables
        let baseFee = use1559 ? initialBaseFee : 0; // gwei
        let totalSupply = startingSupply;           // ETC
        let h = currentBlockHeight;                 // current block height

        // Accumulators for reporting
        let sumEmission=0, sumBurned=0, sumToContract=0, sumMinerRevenue=0, sumTips=0;
        let sumImmediateBaseFeeToMiner=0, sumBaseFeeRevenue=0, sumPayForwardReceived=0, sumBaseFeePrice=0;

        // Buffer used when scenario has payForwardFraction and ellWindow > 0 (ℓ-smoothing)
        // Each entry: {amount: ETC-per-block, blocksRemaining: integer}
        const buf = [];

        for (let i=0;i<n;i++){
          // Jitter adds some simple time variation to demand (just for realistic-looking curves)
          const jitter = Math.sin(i/3)*3 + (Math.random()*2-1);

          // Determine priced demand (in Mgas) after price effects
          const priced = demandAfterPrice(Math.max(0, demandLevel + jitter), baseFee);
          // Convert to actual gas used (cap at block max)
          const blockSizeMGas = Math.min(priced, maxBlockSize);
          const gasUsed = blockSizeMGas * M_GAS; // gas units

          // Emission is the era-specific block reward (ETC)
          const era = Math.floor(h/ERA_BLOCKS);
          const emission = rewardForEra(era);

          // Base fee revenue: baseFee (gwei) * gasUsed * 1e-9 = ETC
          const baseFeeRevenue = use1559 ? safeNum(baseFee * gasUsed * GWEI_TO_ETC) : 0;
          // Tips are per-gas and always go to miner (gwei * gas * 1e-9 = ETC)
          const tipRevenue = safeNum(tipsGwei * gasUsed * GWEI_TO_ETC);

          // Split base fee revenue according to scenario
          const burned = baseFeeRevenue * scenario.burnFraction;
          const toContract = baseFeeRevenue * scenario.contractFraction;
          const toPayForward = baseFeeRevenue * scenario.payForwardFraction;

          // If pay-forward is used, spread 'toPayForward' evenly across the next ellWindow blocks
          let payForwardReceived = 0;
          if (scenario.ellWindow>0 && toPayForward>0){
            buf.push({amount:toPayForward/scenario.ellWindow, blocksRemaining:scenario.ellWindow});
          }
          // Collect any pay-forward amounts delivered on this block
          for (let k=0;k<buf.length;k++){
            if (buf[k].blocksRemaining>0){
              payForwardReceived += buf[k].amount;
              buf[k].blocksRemaining--;
            }
          }
          // Clean up expired buffer entries
          for (let k=buf.length-1;k>=0;k--){
            if (buf[k].blocksRemaining<=0) buf.splice(k,1);
          }

          // Immediate share of base fee going to miner this block (before pay-forward receipts)
          const immediateBaseFeeToMiner = baseFeeRevenue - burned - toContract - toPayForward;
          // Total miner revenue for this block: block reward + immediate base fee share + tips + any pay-forward receipts
          const minerRevenue = emission + immediateBaseFeeToMiner + tipRevenue + payForwardReceived;

          // Choose miner and attribute revenue and block win
          const m = pickWinner(i);
          minerBlocks[m] += 1;
          minerRev[m] += minerRevenue;

          // Update supply:
          // - Block reward (emission) is new supply
          // - Burned portion reduces supply immediately (we model emission minus burned)
          const netEmission = emission - burned;
          totalSupply += netEmission;

          // Update aggregates for the summary
          sumEmission += emission;
          sumBurned += burned;
          sumToContract += toContract;
          sumMinerRevenue += minerRevenue;
          sumTips += tipRevenue;
          sumImmediateBaseFeeToMiner += immediateBaseFeeToMiner;
          sumBaseFeeRevenue += baseFeeRevenue;
          sumPayForwardReceived += payForwardReceived;
          sumBaseFeePrice += baseFee;

          // Adjust base fee for next block using updateBaseFee rule
          baseFee = updateBaseFee(baseFee, gasUsed, targetBlockSize * M_GAS);
          // Advance simulated block height
          h++;
        }

        // Build per-miner rows for UI table
        const perMiner = minerRev.map((rev,i)=>({
          miner:i+1, blocksWon:minerBlocks[i],
          avgRevenuePerWonBlock: minerBlocks[i] ? rev/minerBlocks[i] : 0,
          totalRevenue:rev
        }));

        // Return a compact summary object used throughout the UI
        return {
          summary:{
            simulatedBlocks:n,
            totalEmitted:sumEmission,
            totalBurned:sumBurned,
            totalToContract:sumToContract,
            totalMinerRevenue:sumMinerRevenue,
            totalBaseFeeRevenue:sumBaseFeeRevenue,
            avgBaseFee: n>0 ? (sumBaseFeePrice / n) : 0,
            avgBaseFeeRevenue: n>0 ? (sumBaseFeeRevenue / n) : 0,
            finalSupply: totalSupply,
            netSupplyChange: totalSupply - startingSupply,
            avgBlockReward: n>0 ? (sumEmission / n) : 0,
            avgBaseFeeToMiner: n>0 ? (sumImmediateBaseFeeToMiner / n) : 0,
            avgTips: n>0 ? (sumTips / n) : 0,
            avgPayForward: n>0 ? (sumPayForwardReceived / n) : 0,
            avgMinerRevenue: n>0 ? (sumMinerRevenue / n) : 0,
            perMiner
          }
        };
      }

      // Compute results for each selected scenario and memoize to avoid re-running unnecessarily
      const scenarioResults = useMemo(()=>{
        const out = {};
        for (const k of selectedScenarios) {
          out[k] = simulateSummary(scenarios[k]);
        }
        return out;
      }, [
        selectedScenarios, scenarios, selectedEra, targetBlockSize, demandLevel,
        priceK, initialBaseFee, tipsGwei, numBlocks, capChoice, use1559,
        minerMode, rngSeed
      ]);

      // ===== UI subcomponents (kept simple) =====

      // ScenarioCard: small clickable card for toggling scenario selection
      const ScenarioCard = ({ scenarioKey, scenario, isSelected, onClick }) => (
        <button
          onClick={() => onClick(scenarioKey)}
          className={`panel greek-key p-4 rounded-lg border-2 transition-all text-left ${isSelected ? "border-emerald-500/70 bg-emerald-900/10" : "border-gray-700/60 bg-gray-900/40 hover:bg-gray-900/20"}`}
        >
          <div className="flex items-start gap-3">
            <span className="w-6 h-6 mt-1" style={{ color: scenario.color }}>{React.createElement(scenario.icon)}</span>
            <div className="flex-1">
              <h3 className="font-semibold text-white mb-1">{scenario.name}</h3>
              <p className="text-sm text-gray-300">{scenario.description}{!treasuryEnabled && scenario.contractFraction>0 ? " (Treasury disabled)" : ""}</p>
            </div>
            {isSelected && <div className="text-emerald-400 text-xl">✓</div>}
          </div>
        </button>
      );

      // toggleScenario: convenience for toggling scenario selection with at least one left selected
      const toggleScenario = (key) => {
        if (selectedScenarios.includes(key)) {
          if (selectedScenarios.length>1) setSelectedScenarios(selectedScenarios.filter(s=>s!==key));
        } else {
          setSelectedScenarios([...selectedScenarios, key]);
        }
      };

      // RewardFlow: visual breakdown of average per-block revenue flows for a scenario
      // Note: This component reads scenarioResults (averages) and scenario definitions.
      const RewardFlow = ({ keyId }) => {
        const s = scenarios[keyId], sum = scenarioResults[keyId].summary;
        // minerShareOfBase: immediate fraction of base fee that goes to miners
        const minerShareOfBase = 1 - s.burnFraction - s.contractFraction - s.payForwardFraction;
        const pct = (v)=> (sum.avgMinerRevenue>0 ? Math.round((v/sum.avgMinerRevenue)*100) : 0);
        return (
          <div className="panel greek-key rounded-lg p-6">
            <h4 className="text-sm font-semibold mb-4 text-center" style={{ color: s.color }}>
              Revenue Flow: {s.name}
            </h4>
            <div className="space-y-4">
              <div className="flex items-center gap-3">
                <div className="w-32 text-right text-sm text-gray-300">Block Reward</div>
                <span><I.ArrowRight/></span>
                <div className="flex-1 rounded p-2 border border-emerald-700/50 bg-emerald-900/10">

                <span><I.ArrowRight/></span>

                  <div className="text-xs text-gray-400">Miner ({pct(sum.avgTips)}% of total)</div>
                  <div className="font-semibold text-sky-300">{sum.avgTips.toFixed(6)} ETC/block</div>

              {sum.avgPayForward>0 && (

                <div className="flex items-center justify-between">
                  <div className="text-sm font-semibold text-gray-300">Total Miner Revenue</div>

              </div>
            </div>

      };

      // SupplyCard: shows supply impacts for a given scenario (starting, final, burned, emitted)
      const SupplyCard = ({ keyId }) => {
        const s = scenarios[keyId], sum = scenarioResults[keyId].summary;
        const isDeflationary = sum.netSupplyChange < 0;
        const isNeutral = Math.abs(sum.netSupplyChange) < 1;
        return (
          <div className="panel greek-key rounded-lg p-6">
            <h4 className="text-sm font-semibold mb-4 text-center" style={{ color: s.color }}>
              Supply Impact: {s.name}
            </h4>
            <div className="space-y-4">
              <div className="text-center">
                <div className="text-3xl font-bold mb-2">
                  {isDeflationary ? (
                    <span className="text-red-300 inline-flex items-center gap-2">
                      <I.ArrowDown/> {Math.abs(sum.netSupplyChange).toFixed(2)} ETC
                    </span>
                  ) : isNeutral ? (
                    <span className="text-yellow-300 inline-flex items-center gap-2">
                      <I.Minus/> ~0 ETC
                    </span>
                  ) : (
                    <span className="text-emerald-300 inline-flex items-center gap-2">
                      <I.ArrowUp/> +{sum.netSupplyChange.toFixed(2)} ETC
                    </span>

                  {isDeflationary ? "Supply Decreased" : isNeutral ? "Supply Stable" : "Supply Increased"}

                  <div className="font-semibold">{sum.finalSupply.toLocaleString()}</div>
                </div>
                <div className="bg-gray-900/60 p-3 rounded border border-gray-800">
                  <div className="text-gray-400 mb-1">Emitted</div>
                  <div className="font-semibold text-emerald-300">+{sum.totalEmitted.toFixed(4)}</div>
                </div>
                <div className="bg-gray-900/60 p-3 rounded border border-gray-800">
                  <div className="text-gray-400 mb-1">Burned</div>
                  <div className="font-semibold text-amber-300">-{sum.totalBurned.toFixed(4)}</div>
                </div>
              </div>
              {s.contractFraction>0 && (
                <div className="rounded p-3 border border-emerald-700/50 bg-emerald-900/15">
                  <div className="text-xs text-gray-300 mb-1">Treasury Accumulated</div>
                  <div className="text-lg font-bold accent">{scenarioResults[keyId].summary.totalToContract.toFixed(4)} ETC</div>
                </div>
              )}
            </div>
          </div>
        );
      };

      // ===== Render UI =====
      return (
        <div className="max-w-7xl mx-auto p-6">
          <div className="text-center mb-8">
            <div className="title-font text-4xl md:text-5xl font-bold mb-2 gold flex items-center justify-center gap-3">
              <I.Laurel/> ETC • OLYMPIA <span className="accent">Σ</span>CENARIOS <I.Laurel/>
            </div>
            <p className="text-gray-300">
              A community tool to explore EIP-1559 mechanics on ETC.
            </p>
          </div>

          {/* Top switches with tooltips */}
          <div className="grid md:grid-cols-2 gap-4 mb-8">
            <div className="panel greek-key rounded-lg p-4">
              <div className="flex items-center justify-between">
                <div>
                  <div className="title-font text-lg gold flex items-center">
                    Fee Mechanism
                    <InfoTooltip title="Fee Mechanism">
                      <p className="mb-2"><strong>EIP-1559:</strong> Elastic block size around a target. Base fee adjusts ±12.5% per block depending on demand.</p>
                      <p className="mb-1"><strong>Pre-1559:</strong> Fixed block gas limit, no base fee; only tips.</p>
                    </InfoTooltip>
                  </div>
                  <div className="text-sm text-gray-300">{use1559 ? "EIP-1559: Dynamic base fee + elastic blocks" : "Pre-1559: Fixed gas limit + tips only"}</div>
                </div>
                <button
                  onClick={()=>setUse1559(!use1559)}
                  className={`px-5 py-2 rounded border ${use1559 ? "border-emerald-500 text-white bg-emerald-700/30" : "border-gray-600 text-gray-200 bg-gray-800"}`}
                >
                  {use1559 ? "EIP-1559 Active" : "Pre-1559 Mode"}
                </button>
              </div>
            </div>

            <div className="panel greek-key rounded-lg p-4">

                  onClick={()=>setTreasuryEnabled(!treasuryEnabled)}
                  className={`px-5 py-2 rounded border ${treasuryEnabled ? "border-amber-400 text-white bg-amber-700/30" : "border-gray-600 text-gray-200 bg-gray-800"}`}

                  {treasuryEnabled ? "Treasury: On" : "Treasury: Off"}
                </button>
              </div>
            </div>
          </div>

              ))}

            <p className="text-sm text-gray-400 mt-2">Compare Classic, Burn, Olympia… toggle the Treasury switch to see differences.</p>

                </div>

              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-6">
              <div>
                <div className="flex items-center mb-2">
                  <label className="text-sm font-medium">Target Block Size (Mgas)</label>
                  <InfoTooltip title="Target Block Size">
                    <p>Under EIP-1559, blocks expand/contract around a target. If gas used &gt; target, base fee rises; if &lt; target, base fee falls.</p>
                  </InfoTooltip>
                </div>
                <input type="range" min="5" max="30" step="1" value={targetBlockSize} onChange={(e)=>setTargetBlockSize(parseFloat(e.target.value))} className="w-full" style={{accentColor:"var(--etc-green)"}} />
                <div className="text-right text-sm text-gray-400 mt-1">
                  {targetBlockSize}M (max: {use1559 ? targetBlockSize*2 : targetBlockSize}M)
                </div>
              </div>

              <div>
                <div className="flex items-center mb-2">
                  <label className="text-sm font-medium">Baseline Demand (Mgas)</label>
                  <InfoTooltip title="Baseline Demand">
                    <p>Average gas demanded by users before pricing effects. Higher demand means fuller blocks and upward pressure on the base fee.</p>
                  </InfoTooltip>
                </div>
                <input type="range" min="1" max="40" step="1" value={demandLevel} onChange={(e)=>setDemandLevel(parseFloat(e.target.value))} className="w-full" style={{accentColor:"var(--etc-green)"}} />
                <div className="text-right text-sm text-gray-400 mt-1">{demandLevel}M</div>
              </div>

              <div>
                <div className="flex items-center mb-2">
                  <label className="text-sm font-medium">Price Sensitivity (gwei)</label>
                  <InfoTooltip title="Price Sensitivity (K)">
                    <p>A simple elasticity parameter. As base fee approaches/exceeds K, effective demand shrinks (users defer or batch transactions).</p>
                  </InfoTooltip>
                </div>
                <input type="range" min="10" max="200" step="5" value={priceK} onChange={(e)=>setPriceK(parseFloat(e.target.value))} className="w-full" style={{accentColor:"var(--etc-green)"}} />
                <div className="text-right text-sm text-gray-400 mt-1">K = {priceK} gwei</div>
              </div>

              <div>
                <div className="flex items-center mb-2">
                  <label className="text-sm font-medium">Initial Base Fee (gwei)</label>
                  <InfoTooltip title="Initial Base Fee">
                    <p>Starting base fee per gas when the simulation begins. It will adjust each block by up to ±12.5% under EIP-1559.</p>
                  </InfoTooltip>
                </div>
                <input type="range" min="0" max="500" step="1" value={initialBaseFee} onChange={(e)=>setInitialBaseFee(parseFloat(e.target.value))} className="w-full" style={{accentColor:"var(--etc-green)"}} />
                <div className="text-right text-sm text-gray-400 mt-1">{use1559 ? `${initialBaseFee} gwei` : "N/A (Pre-1559)"}</div>
              </div>

              <div>
                <div className="flex items-center mb-2">

                  </InfoTooltip>
                </div>
                <input type="range" min="0" max="10" step="0.1" value={tipsGwei} onChange={(e)=>setTipsGwei(parseFloat(e.target.value))} className="w-full" style={{accentColor:"var(--etc-green)"}} />
                <div className="text-right text-sm text-gray-400 mt-1">{tipsGwei.toFixed(1)} gwei</div>
              </div>

              <div className="md:col-span-2 lg:col-span-3">
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-2">
                    <label className="text-sm font-medium">Simulation Length (blocks)</label>
                    <span className="text-xs text-gray-400">(0 → 5,000,000, max 1 era)</span>
                    <InfoTooltip title="Simulation Length & Safety">
                      <p className="mb-2">The run is capped by: your requested blocks, the safety lever, and a hard limit of 1 era (5,000,000 blocks).</p>
                      <ul className="list-disc list-inside text-gray-300">
                        <li><strong>500k:</strong> Cap at 500,000 blocks</li>
                        <li><strong>2.5M:</strong> Cap at 2,500,000 blocks</li>
                        <li><strong>No Limit:</strong> Only the 1-era cap applies</li>
                      </ul>
                    </InfoTooltip>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-gray-400">Safety:</span>
                    <button className={`px-3 py-1 rounded border ${capChoice==="500k"?"border-emerald-500 text-emerald-400":"border-gray-600 text-gray-300 hover:border-gray-400"}`} onClick={()=>setCapChoice("500k")}>500k</button>
                    <button className={`px-3 py-1 rounded border ${capChoice==="2.5m"?"border-emerald-500 text-emerald-400":"border-gray-600 text-gray-300 hover:border-gray-400"}`} onClick={()=>setCapChoice("2.5m")}>2.5M</button>
                    <button className={`px-3 py-1 rounded border ${capChoice==="none"?"border-emerald-500 text-emerald-400":"border-gray-600 text-gray-300 hover:border-gray-400"}`} onClick={()=>setCapChoice("none")}>No Limit</button>
                  </div>
                </div>
                <input
                  type="range" min="0" max="5000000" step="10000"
                  value={numBlocks}
                  onChange={(e)=>setNumBlocks(parseInt(e.target.value))}
                  className="w-full"
                  style={{accentColor:"var(--etc-green)"}}
                />
                <div className="text-right text-sm text-gray-400 mt-1">
                  Requested: {numBlocks.toLocaleString()} • Safety: {capChoice==="none"?"∞":(capChoice==="2.5m"?"2,500,000":"500,000")}
                  {' '}• Simulated (≤ 1 era): <span className="text-white font-semibold">
                    {Math.min(numBlocks, (capChoice==="500k"?500000:capChoice==="2.5m"?2500000:Number.POSITIVE_INFINITY), 5000000).toLocaleString()}
                  </span>
                </div>
              </div>

              <div className="md:col-span-2 lg:col-span-3 border-t border-gray-800 pt-4">
                <div className="flex items-center mb-2">
                  <div className="text-sm font-semibold text-gray-200">Miner Distribution</div>
                  <InfoTooltip title="Miner Distribution Modes">
                    <p className="mb-2"><strong>Equal:</strong> Round-robin; 5 miners each ~20% of blocks (illustrates fair share).</p>
                    <p className="mb-2"><strong>Weighted:</strong> Random with fixed weights 40/30/20/5/5 (illustrates concentration).</p>
                    <p><strong>Cellular Automaton:</strong> Rule-110 stream hashed to select miners with “churn” windows to show miners entering/exiting over time.</p>
                  </InfoTooltip>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                    <label className="text-sm font-medium">Mode</label>
                    <select className="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-2" value={minerMode} onChange={(e)=>setMinerMode(e.target.value)}>
                      <option value="equal">Equal (20/20/20/20/20)</option>
                      <option value="weighted">Weighted (40/30/20/5/5)</option>
                      <option value="automaton">Cellular Automaton (Rule 110 + churn)</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-sm font-medium">Random Seed</label>
                    <InfoTooltip title="Random Seed">
                      <p>Controls deterministic randomness for Weighted/Automaton modes. Change to explore different miner sequences.</p>
                    </InfoTooltip>
                    <input type="number" className="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-2" value={rngSeed} onChange={(e)=>setRngSeed(parseInt(e.target.value||'1'))}/>
                    <div className="text-xs text-gray-500 mt-1">For weighted/automaton modes.</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* Results */}
          <div className="space-y-8">
            {selectedScenarios.map((k)=>{
              const s = scenarios[k];
              const res = scenarioResults[k];
              if (!res) return null;
              return (
                <div key={k} className="panel greek-key rounded-lg p-6" style={{ borderColor: s.color }}>
                  <div className="flex items-center gap-3 mb-4">
                    <span className="w-8 h-8" style={{ color: s.color }}>{React.createElement(s.icon)}</span>
                    <div>
                      <h3 className="title-font text-2xl font-bold" style={{ color: s.color }}>{s.name}</h3>
                      <p className="text-gray-300 text-sm">{s.description}{!treasuryEnabled && s.contractFraction>0 ? " (Treasury disabled)" : ""}</p>
                    </div>
                  </div>

                  <div className="bg-emerald-900/15 border border-emerald-700/40 rounded p-3 mb-4">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
                      <div><div className="text-gray-400">Era</div><div className="font-bold">Era {selectedEra}</div></div>
                      <div><div className="text-gray-400">Start Block</div><div className="font-bold">{(selectedEra*5_000_000).toLocaleString()}</div></div>
                      <div><div className="text-gray-400">Reward</div><div className="font-bold">{rewardForEra(selectedEra).toFixed(4)} ETC</div></div>
                      <div><div className="text-gray-400">Blocks Simulated</div><div className="font-bold">{res.summary.simulatedBlocks.toLocaleString()}</div></div>
                    </div>
                    <div className="mt-1 text-xs text-gray-500">Run capped to ≤ 1 era and the selected safety lever.</div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <RewardFlow keyId={k}/>
                    <SupplyCard keyId={k}/>
                  </div>

                  <div className="mt-6">
                    <div className="text-sm font-semibold text-gray-200 mb-2">Per-Miner Results</div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-sm">
                        <thead>
                          <tr className="border-b border-gray-800">
                            <th className="text-left p-2 text-gray-400">Miner</th>

                      </table>
                    </div>
                  </div>
                </div>
              );

                <thead>
                  <tr className="border-b border-gray-800">
                    <th className="text-left p-3 text-gray-400">Metric</th>
                    {["classic","olympia","burn","blended","lsmoothed"].filter(k=>selectedScenarios.includes(k)).map(k=>(
                      <th key={k} className="text-right p-3" style={{ color: scenarios[k].color }}>{scenarios[k].name}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  <tr className="border-b border-gray-900/40">
                    <td className="p-3 text-gray-300">Avg Miner Revenue / Block</td>
                    {selectedScenarios.map(k=>(
                      <td key={k} className="text-right p-3 font-semibold">{scenarioResults[k].summary.avgMinerRevenue.toFixed(6)} ETC</td>
                    ))}
                  </tr>
                  <tr className="border-b border-gray-900/40">
                    <td className="p-3 text-gray-300">Avg Base Fee Collected / Block</td>
                    {selectedScenarios.map(k=>(
                      <td key={k} className="text-right p-3">{scenarioResults[k].summary.avgBaseFeeRevenue.toFixed(6)} ETC</td>
                    ))}
                  </tr>
                  <tr className="border-b border-gray-900/40">
                    <td className="p-3 text-gray-300">Total Miner Revenue</td>
                    {selectedScenarios.map(k=>(
                      <td key={k} className="text-right p-3 text-sky-300">{scenarioResults[k].summary.totalMinerRevenue.toFixed(4)} ETC</td>
                    ))}
                  </tr>
                  <tr className="border-b border-gray-900/40">
                    <td className="p-3 text-gray-300">Total Burned</td>
                    {selectedScenarios.map(k=>(
                      <td key={k} className="text-right p-3 text-amber-300">{scenarioResults[k].summary.totalBurned.toFixed(4)} ETC</td>
                    ))}
                  </tr>
                  <tr className="border-b border-gray-900/40">
                    <td className="p-3 text-gray-300">Treasury Accumulated</td>
                    {selectedScenarios.map(k=>(
                      <td key={k} className="text-right p-3 accent">{scenarioResults[k].summary.totalToContract.toFixed(4)} ETC</td>
                    ))}
                  </tr>
                  <tr className="border-b border-gray-900/40">
                    <td className="p-3 text-gray-300">Total Supply Change</td>
                    {selectedScenarios.map(k=>{
                      const ch = scenarioResults[k].summary.netSupplyChange;
                      return (
                        <td key={k} className="text-right p-3 font-semibold">
                          <span className={ch<0?"text-red-300":ch>1?"text-emerald-300":"text-yellow-300"}>
                            {ch>0?"+":""}{ch.toFixed(2)} ETC
                          </span>
                        </td>
                      );
                    })}
                  </tr>
                  <tr>
                    <td className="p-3 text-gray-300">Avg Base Fee (price)</td>
                    {selectedScenarios.map(k=>(
                      <td key={k} className="text-right p-3">{scenarioResults[k].summary.avgBaseFee.toFixed(2)} gwei</td>
                    ))}
                  </tr>
                </tbody>
              </table>
            </div>
            <div className="mt-3 text-xs text-gray-400">
              Run length = min(Requested, Safety Lever, 1 Era).
            </div>
          </div>

          <div className="text-center text-gray-400 text-sm border-t border-gray-800 pt-6 mt-8">
            <p className="mb-1"><strong className="gold">Policy:</strong> ECIP-1017 (5M blocks/era, −20% reward/era). Supply derived from era selection.</p>
            <p className="mb-1"><strong className="gold">Fees:</strong> EIP-1559 base fee (±12.5%/block) + tips; optional ℓ-smoothing; price-elastic demand.</p>
            <p className="text-xs text-gray-500 mt-2">Units: gwei × gas × 1e-9 = ETC.</p>
          </div>
        </div>
      );
    }

    // Render with error capture - keep this minimal and informative
    try {
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    } catch (e) {
      const box = document.getElementById('errbox');
      box.style.display = 'block';
      box.textContent = String(e && e.message ? e.message : e);
      console.error(e);
    }
  </script>
</body>
</html>
